<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<div class="contact-form">

	<form method="post" action="{{ site.data.settings.contact_settings.form_action }}" id="contact-form">

		<div class="contact-form__item">
			<label class="contact-form__label">Email Address *</label>
			<input type="email" name="email" placeholder="Your email address..." class="contact-form__input" required>
		</div>

		<div class="contact-form__item">
			<label class="contact-form__label">Name *</label>
			<input type="text" name="name" placeholder="Your name..." class="contact-form__input" required>
		</div>

		<div class="contact-form__item">
			<label class="contact-form__label">Message *</label>
			<textarea name="message" placeholder="Your message..." class="contact-form__textarea" required></textarea>
		</div>

		<input type="hidden" name="_subject" value="{{ site.data.settings.contact_settings.email_subject }}" />
		<input type="text" name="_gotcha" style="display: none;" class="contact-form__gotcha" val="">

    <div class="g-recaptcha" data-sitekey="6Lc5kXkaAAAAAPy0GBh9claxz9Ia1pdzwt7Y57uX"></div>

		<div class="contact-form__item">
			<input type="submit" id="contact-form-button" value="{{ site.data.settings.contact_settings.send_button_text }}" class="button button--large">
		</div>

		<span id="contact-form-status"></span>

	</form>

</div>

<script>
  window.addEventListener("DOMContentLoaded", function() {

    var form = document.getElementById("contact-form");
    var button = document.getElementById("contact-form-button");
    var status = document.getElementById("contact-form-status");

    function checkform(_form) {
      var inputs = _form.elements;
      for (var i = 0; i < inputs.length; i++) {
        if(inputs[i].hasAttribute("required")){
          if(inputs[i].value == ""){
            alert("Please fill all required fields");
            return false;
          }
        }
      }
      return true;
    }

    function success() {
      form.reset();
      button.style = "display: none ";
      status.innerHTML = "Message sent! I'll reply ASAP. Thank you!";
    }

    function error() {
      status.innerHTML = "Oops! There was a problem.";
    }

    form.addEventListener("submit", function(ev) {
      ev.preventDefault();
	    if (checkform(form)) {
	      var data = new FormData(form);
	      ajax(form.method, form.action, data, success, error);
	    }
    });

    setTimeout(() => {
      var el = document.getElementById('g-recaptcha-response');
      if (el) {
        el.setAttribute('required', 'required');
      }
    }, 1000);

  });

  function ajax(method, url, data, success, error) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url);
    xhr.setRequestHeader("Accept", "application/json");
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== XMLHttpRequest.DONE) return;
      if (xhr.status === 200) {
        success(xhr.response, xhr.responseType);
      } else {
        error(xhr.status, xhr.response, xhr.responseType);
      }
    };
    xhr.send(data);
  }
</script>
